<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-label="System flow map">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset="55%" stop-color="#020617"/><stop offset="100%" stop-color="#08111f"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#22c55e"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#67e8f9" opacity=".20"/></pattern>
    <style>
      @keyframes dash{to{stroke-dashoffset:-440}}
      @keyframes nodePulse{0%,100%{r:18;opacity:.72}50%{r:23;opacity:1}}
      @keyframes flicker{0%,100%{opacity:.72}50%{opacity:1}}
      .dash{stroke-dasharray:10 18;animation:dash 9s linear infinite}.node{animation:nodePulse 3s ease-in-out infinite}.scan{animation:flicker 4s ease-in-out infinite}.sans{font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Arial}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>
  <rect width="1280" height="470" rx="32" fill="url(#bg)"/><rect width="1280" height="470" rx="32" fill="url(#dots)" opacity=".85"/>
  <text class="sans" x="52" y="60" fill="#f8fafc" font-size="31" font-weight="900">SYSTEM BUILD MAP</text>
  <text class="mono" x="52" y="94" fill="#7dd3fc" font-size="15">from model internals to APIs, dashboards, voice pipelines and deployable tools</text>
  <path class="dash" d="M166 255 C310 160, 442 160, 565 255 S812 350, 950 255 S1100 160, 1170 230" fill="none" stroke="url(#edge)" stroke-width="4" opacity=".78" filter="url(#glow)"/>

  <g class="sans" font-weight="800">
    <g transform="translate(56 178)">
      <rect width="254" height="130" rx="24" fill="#0b1220" stroke="#38bdf8" stroke-opacity=".50"/>
      <circle class="node" cx="52" cy="55" r="18" fill="#0e7490" filter="url(#glow)"/>
      <text x="88" y="46" fill="#e0f2fe" font-size="20">Voice Agents</text>
      <text x="88" y="75" fill="#93c5fd" font-size="14">STT → LLM → TTS</text>
      <text x="28" y="108" fill="#94a3b8" font-size="12" font-weight="650">calls · barge-in · memory</text>
    </g>
    <g transform="translate(360 100)">
      <rect width="254" height="130" rx="24" fill="#0b1220" stroke="#a78bfa" stroke-opacity=".50"/>
      <circle class="node" cx="52" cy="55" r="18" fill="#6d28d9" filter="url(#glow)"/>
      <text x="88" y="46" fill="#f5f3ff" font-size="20">RAG Systems</text>
      <text x="88" y="75" fill="#c4b5fd" font-size="14">Qdrant + FastAPI</text>
      <text x="28" y="108" fill="#94a3b8" font-size="12" font-weight="650">documents · retrieval · local LLM</text>
    </g>
    <g transform="translate(666 236)">
      <rect width="254" height="130" rx="24" fill="#0b1220" stroke="#22c55e" stroke-opacity=".46"/>
      <circle class="node" cx="52" cy="55" r="18" fill="#15803d" filter="url(#glow)"/>
      <text x="88" y="46" fill="#dcfce7" font-size="20">Full-Stack</text>
      <text x="88" y="75" fill="#86efac" font-size="14">MERN dashboards</text>
      <text x="28" y="108" fill="#94a3b8" font-size="12" font-weight="650">RBAC · APIs · workflows</text>
    </g>
    <g transform="translate(970 112)">
      <rect width="254" height="130" rx="24" fill="#0b1220" stroke="#f59e0b" stroke-opacity=".50"/>
      <circle class="node" cx="52" cy="55" r="18" fill="#b45309" filter="url(#glow)"/>
      <text x="88" y="46" fill="#ffedd5" font-size="20">Transformers</text>
      <text x="88" y="75" fill="#fed7aa" font-size="14">training + translation</text>
      <text x="28" y="108" fill="#94a3b8" font-size="12" font-weight="650">tokenizers · masks · failure loops</text>
    </g>
  </g>

  <line class="scan" x1="56" y1="408" x2="1224" y2="408" stroke="#38bdf8" stroke-opacity=".22"/>
  <text class="mono" x="56" y="432" fill="#94a3b8" font-size="13">signal path: voice interfaces → context retrieval → product workflow → model internals</text>
</svg>
