<svg width="1280" height="210" viewBox="0 0 1280 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1280" y2="210">
      <stop stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.65"/>
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes scan {
        0% { transform: translateX(-350px); opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.9; }
        100% { transform: translateX(350px); opacity: 0; }
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }

      @keyframes dash {
        to { stroke-dashoffset: -90; }
      }

      .scanner {
        animation: scan 5.5s ease-in-out infinite;
        transform-origin: center;
      }

      .pulse {
        animation: pulse 2.8s ease-in-out infinite;
      }

      .dash {
        stroke-dasharray: 9 14;
        animation: dash 4s linear infinite;
      }
    </style>
  </defs>

  <rect width="1280" height="210" rx="28" fill="#020617"/>
  <rect x="2" y="2" width="1276" height="206" rx="26" stroke="url(#border)" stroke-width="2"/>

  <circle cx="640" cy="105" r="360" fill="url(#coreGlow)"/>

  <g opacity="0.23">
    <path d="M60 50 H1220" stroke="#38bdf8" stroke-width="1"/>
    <path d="M60 160 H1220" stroke="#8b5cf6" stroke-width="1"/>
    <path d="M180 25 V185" stroke="#1e293b" stroke-width="1"/>
    <path d="M360 25 V185" stroke="#1e293b" stroke-width="1"/>
    <path d="M540 25 V185" stroke="#1e293b" stroke-width="1"/>
    <path d="M740 25 V185" stroke="#1e293b" stroke-width="1"/>
    <path d="M920 25 V185" stroke="#1e293b" stroke-width="1"/>
    <path d="M1100 25 V185" stroke="#1e293b" stroke-width="1"/>
  </g>

  <g class="scanner" opacity="0.8">
    <rect x="570" y="18" width="140" height="174" rx="70" fill="#38bdf8" opacity="0.09"/>
    <path d="M640 24 V186" stroke="#38bdf8" stroke-width="2" opacity="0.55"/>
  </g>

  <path class="dash" d="M120 105 H430" stroke="#38bdf8" stroke-width="2" opacity="0.45"/>
  <path class="dash" d="M850 105 H1160" stroke="#a78bfa" stroke-width="2" opacity="0.45"/>

  <g filter="url(#softGlow)">
    <circle cx="110" cy="105" r="6" fill="#38bdf8" class="pulse"/>
    <circle cx="1170" cy="105" r="6" fill="#a78bfa" class="pulse"/>
    <circle cx="640" cy="105" r="10" fill="#22d3ee"/>
  </g>

  <text x="640" y="82" text-anchor="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="18" font-weight="700"
        letter-spacing="5"
        fill="#7dd3fc">
    ACTIVITY CONSOLE
  </text>

  <text x="640" y="122" text-anchor="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="36" font-weight="800"
        letter-spacing="-1"
        fill="#f8fafc">
    GitHub Engineering Telemetry
  </text>

  <text x="640" y="153" text-anchor="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="15" font-weight="500"
        letter-spacing="0.4"
        fill="#cbd5e1">
    repositories · languages · commit rhythm · build signal
  </text>

  <g opacity="0.85">
    <rect x="92" y="76" width="116" height="58" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="150" y="100" text-anchor="middle" font-family="Inter, Arial" font-size="11" font-weight="700" fill="#7dd3fc">TRACKING</text>
    <text x="150" y="120" text-anchor="middle" font-family="Inter, Arial" font-size="13" font-weight="800" fill="#e5e7eb">LIVE BUILD</text>

    <rect x="1072" y="76" width="116" height="58" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="1130" y="100" text-anchor="middle" font-family="Inter, Arial" font-size="11" font-weight="700" fill="#c4b5fd">SIGNAL</text>
    <text x="1130" y="120" text-anchor="middle" font-family="Inter, Arial" font-size="13" font-weight="800" fill="#e5e7eb">PUBLIC LOG</text>
  </g>
</svg>
