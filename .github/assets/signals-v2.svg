<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-label="Proof signals">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050816"/>
      <stop offset="55%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="70%">
      <stop stop-color="#7dd3fc" stop-opacity=".20"/>
      <stop offset="70%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes blink { 0%,100% { opacity:.35; } 50% { opacity:1; } }
      @keyframes dash { to { stroke-dashoffset:-80; } }
      .blink{animation:blink 2.6s ease-in-out infinite}.dash{animation:dash 9s linear infinite}
      .sans{font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .title{font-size:20px;font-weight:950}.main{font-size:17px;font-weight:820}.sub{font-size:13px;font-weight:650;fill:#94a3b8}
    </style>
  </defs>
  <rect width="1280" height="620" rx="34" fill="url(#bg)"/>
  <ellipse cx="670" cy="425" rx="610" ry="240" fill="url(#aura)"/>
  <path class="dash" d="M70 116H1210" stroke="#7dd3fc" stroke-opacity=".22" stroke-width="2" stroke-dasharray="8 18"/>

  <text class="sans" x="56" y="62" fill="#f8fafc" font-size="30" font-weight="950">PROOF SIGNALS</text>
  <text class="mono" x="56" y="96" fill="#7dd3fc" font-size="15">verifiable signals from competitions, internship work, hackathons and shipped systems</text>

  <g class="sans">
    <g transform="translate(70 155)">
      <rect width="540" height="150" rx="26" fill="#08111f" stroke="#f59e0b" stroke-opacity=".52"/>
      <path d="M30 32H510" stroke="#f59e0b" stroke-opacity=".20"/>
      <circle class="blink" cx="42" cy="78" r="9" fill="#f59e0b" filter="url(#glow)"/>
      <text class="title" x="70" y="68" fill="#fcd34d">Amazon ML Challenge 2025</text>
      <text class="main" x="70" y="101" fill="#e5e7eb">Ranked 1565 among 80,000+ participants</text>
      <text class="sub" x="70" y="130">national-scale ML competition signal</text>
    </g>

    <g transform="translate(670 155)">
      <rect width="540" height="150" rx="26" fill="#08111f" stroke="#38bdf8" stroke-opacity=".52"/>
      <path d="M30 32H510" stroke="#38bdf8" stroke-opacity=".20"/>
      <circle class="blink" cx="42" cy="78" r="9" fill="#38bdf8" filter="url(#glow)"/>
      <text class="title" x="70" y="68" fill="#7dd3fc">HashByte Studio</text>
      <text class="main" x="70" y="101" fill="#e5e7eb">Game Developer Intern · 8 weeks</text>
      <text class="sub" x="70" y="130">bug fixing, testing, Unity feature optimization</text>
    </g>

    <g transform="translate(70 355)">
      <rect width="540" height="150" rx="26" fill="#08111f" stroke="#a78bfa" stroke-opacity=".52"/>
      <path d="M30 32H510" stroke="#a78bfa" stroke-opacity=".20"/>
      <circle class="blink" cx="42" cy="78" r="9" fill="#a78bfa" filter="url(#glow)"/>
      <text class="title" x="70" y="68" fill="#c4b5fd">Hackveda 2026</text>
      <text class="main" x="70" y="101" fill="#e5e7eb">Winner · Top 10 Teams</text>
      <text class="sub" x="70" y="130">prototype execution + product presentation</text>
    </g>

    <g transform="translate(670 355)">
      <rect width="540" height="150" rx="26" fill="#08111f" stroke="#22c55e" stroke-opacity=".52"/>
      <path d="M30 32H510" stroke="#22c55e" stroke-opacity=".20"/>
      <circle class="blink" cx="42" cy="78" r="9" fill="#22c55e" filter="url(#glow)"/>
      <text class="title" x="70" y="68" fill="#86efac">IBM Innovation Poster Competition</text>
      <text class="main" x="70" y="101" fill="#e5e7eb">1st Place · 2024</text>
      <text class="sub" x="70" y="130">technical storytelling and innovation signal</text>
    </g>
  </g>

  <text class="mono" x="56" y="565" fill="#64748b" font-size="13">signal quality &gt; decoration — every block maps to a real resume/profile item</text>
</svg>