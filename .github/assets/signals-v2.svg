<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Proof signals">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050816"/>
      <stop offset="58%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="60%">
      <stop stop-color="#7dd3fc" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes floatY { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
      @keyframes blink { 0%,100% { opacity:.35; } 50% { opacity:1; } }
      @keyframes scan { 0% { transform: translateX(-220px); opacity:0; } 25% { opacity:.5; } 100% { transform: translateX(1280px); opacity:0; } }
      .float { animation: floatY 5.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .delay1 { animation-delay:.55s; }
      .delay2 { animation-delay:1.1s; }
      .delay3 { animation-delay:1.65s; }
      .blink { animation: blink 2.2s ease-in-out infinite; }
      .scan { animation: scan 7s linear infinite; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, Segoe UI, Arial; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="360" rx="32" fill="url(#bg)"/>
  <ellipse cx="655" cy="315" rx="560" ry="170" fill="url(#aura)"/>
  <rect class="scan" x="0" y="0" width="180" height="360" fill="#7dd3fc" opacity=".06"/>

  <text class="sans" x="50" y="58" fill="#f8fafc" font-size="28" font-weight="900">PROOF SIGNALS</text>
  <text class="mono" x="50" y="91" fill="#7dd3fc" font-size="15">verified signals from competitions, internships, hackathons and shipped systems</text>

  <g class="sans">
    <g transform="translate(58 132)">
      <g class="float">
        <rect width="268" height="132" rx="24" fill="#08111f" stroke="#f59e0b" stroke-opacity=".48"/>
        <path d="M24 24 H244" stroke="#f59e0b" stroke-opacity=".18"/>
        <circle class="blink" cx="36" cy="60" r="8" fill="#f59e0b" filter="url(#glow)"/>
        <text x="58" y="48" fill="#fcd34d" font-size="16" font-weight="900">Amazon ML Challenge</text>
        <text x="58" y="78" fill="#e5e7eb" font-size="14" font-weight="760">Ranked 1565 / 80,000+</text>
        <text x="58" y="104" fill="#94a3b8" font-size="12" font-weight="650">national scale ML competition</text>
      </g>
    </g>

    <g transform="translate(355 132)">
      <g class="float delay1">
        <rect width="268" height="132" rx="24" fill="#08111f" stroke="#38bdf8" stroke-opacity=".48"/>
        <path d="M24 24 H244" stroke="#38bdf8" stroke-opacity=".18"/>
        <circle class="blink" cx="36" cy="60" r="8" fill="#38bdf8" filter="url(#glow)"/>
        <text x="58" y="48" fill="#7dd3fc" font-size="16" font-weight="900">HashByte Studio</text>
        <text x="58" y="78" fill="#e5e7eb" font-size="14" font-weight="760">Game Dev Intern</text>
        <text x="58" y="104" fill="#94a3b8" font-size="12" font-weight="650">bugs, testing, optimization</text>
      </g>
    </g>

    <g transform="translate(652 132)">
      <g class="float delay2">
        <rect width="268" height="132" rx="24" fill="#08111f" stroke="#a78bfa" stroke-opacity=".48"/>
        <path d="M24 24 H244" stroke="#a78bfa" stroke-opacity=".18"/>
        <circle class="blink" cx="36" cy="60" r="8" fill="#a78bfa" filter="url(#glow)"/>
        <text x="58" y="48" fill="#c4b5fd" font-size="16" font-weight="900">Hackveda 2026</text>
        <text x="58" y="78" fill="#e5e7eb" font-size="14" font-weight="760">Winner · Top 10 Teams</text>
        <text x="58" y="104" fill="#94a3b8" font-size="12" font-weight="650">prototype + pitch execution</text>
      </g>
    </g>

    <g transform="translate(949 132)">
      <g class="float delay3">
        <rect width="273" height="132" rx="24" fill="#08111f" stroke="#22c55e" stroke-opacity=".48"/>
        <path d="M24 24 H249" stroke="#22c55e" stroke-opacity=".18"/>
        <circle class="blink" cx="36" cy="60" r="8" fill="#22c55e" filter="url(#glow)"/>
        <text x="58" y="48" fill="#86efac" font-size="16" font-weight="900">IBM Innovation Poster</text>
        <text x="58" y="78" fill="#e5e7eb" font-size="14" font-weight="760">1st Place · 2024</text>
        <text x="58" y="104" fill="#94a3b8" font-size="12" font-weight="650">clear technical storytelling</text>
      </g>
    </g>
  </g>

  <text class="mono" x="50" y="315" fill="#64748b" font-size="13">signal quality &gt; decoration — every block maps to something verifiable</text>
</svg>
