<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset="100%" stop-color="#020617"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}.card{animation:rise 5s ease-in-out infinite}.card:nth-child(2){animation-delay:.5s}.card:nth-child(3){animation-delay:1s}.card:nth-child(4){animation-delay:1.5s}.blink{animation:blink 2s ease-in-out infinite}.sans{font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Arial}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style></defs>
