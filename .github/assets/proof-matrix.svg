<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Project proof matrix">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset="55%" stop-color="#020617"/><stop offset="100%" stop-color="#061827"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.row{animation:rise 6s ease-in-out infinite}.row:nth-child(2){animation-delay:.4s}.row:nth-child(3){animation-delay:.8s}.row:nth-child(4){animation-delay:1.2s}.row:nth-child(5){animation-delay:1.6s}.sans{font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Arial}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style></defs>
<rect width="1280" height="340" rx="30" fill="url(#bg)"/><text class="sans" x="52" y="56" fill="#f8fafc" font-size="28" font-weight="900">WHAT THE SYSTEMS PROVE</text><text class="mono" x="52" y="88" fill="#7dd3fc" font-size="15">colored signal map instead of plain bullet spam</text>
<g transform="translate(58 118)" class="sans" font-weight="800" font-size="16">
 <g class="row"><rect width="1164" height="38" rx="18" fill="#07111f" stroke="#38bdf8" stroke-opacity=".26"/><text x="22" y="25" fill="#67e8f9">Voice AI</text><text x="210" y="25" fill="#e5e7eb">real-time call handling, VAD, barge-in, STT → LLM → TTS, Twilio Media Streams</text></g>
 <g class="row" transform="translate(0 48)"><rect width="1164" height="38" rx="18" fill="#07111f" stroke="#a78bfa" stroke-opacity=".26"/><text x="22" y="25" fill="#c4b5fd">RAG Systems</text><text x="210" y="25" fill="#e5e7eb">PDF ingestion, semantic search, local LLM inference, vector retrieval, API-key protected endpoints</text></g>
 <g class="row" transform="translate(0 96)"><rect width="1164" height="38" rx="18" fill="#07111f" stroke="#22c55e" stroke-opacity=".26"/><text x="22" y="25" fill="#86efac">Full-Stack Apps</text><text x="210" y="25" fill="#e5e7eb">MERN dashboards, RBAC, REST APIs, auth flows, exports, file handling, status workflows</text></g>
 <g class="row" transform="translate(0 144)"><rect width="1164" height="38" rx="18" fill="#07111f" stroke="#f59e0b" stroke-opacity=".26"/><text x="22" y="25" fill="#fcd34d">Model Internals</text><text x="210" y="25" fill="#e5e7eb">Transformer training loops, tokenization, masking, failure analysis, rebuild-from-scratch thinking</text></g>
 <g class="row" transform="translate(0 192)"><rect width="1164" height="38" rx="18" fill="#07111f" stroke="#ef4444" stroke-opacity=".24"/><text x="22" y="25" fill="#fca5a5">ML Fundamentals</text><text x="210" y="25" fill="#e5e7eb">K-Means compression, visual evaluation, tradeoff analysis, implementation without hiding behind libraries</text></g>
</g></svg>