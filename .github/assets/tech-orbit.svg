<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Tech stack orbit">
<defs><radialGradient id="bg" cx="50%" cy="45%" r="72%"><stop stop-color="#0b1b35"/><stop offset="60%" stop-color="#020617"/><stop offset="100%" stop-color="#020617"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes spin2{from{transform:rotate(360deg)}to{transform:rotate(0)}}@keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}.orbit{animation:spin 34s linear infinite;transform-origin:640px 215px}.orbit2{animation:spin2 42s linear infinite;transform-origin:640px 215px}.pulse{animation:pulse 2.6s ease-in-out infinite}.sans{font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Arial}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style></defs>
