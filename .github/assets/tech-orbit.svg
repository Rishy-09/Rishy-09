<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Tech stack console">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset=".48" stop-color="#071526"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".28"/>
      <stop offset=".45" stop-color="#7c3aed" stop-opacity=".12"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
      @keyframes dash { to { stroke-dashoffset:-80; } }
      .sans{font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .pulse{animation:pulse 3s ease-in-out infinite}.dash{animation:dash 8s linear infinite}
      .card-title{font-size:18px;font-weight:900}.card-line{font-size:15px;font-weight:720}.muted{fill:#94a3b8;font-size:13px;font-weight:650}
    </style>
  </defs>
  <rect width="1280" height="640" rx="34" fill="url(#bg)"/>
  <ellipse cx="640" cy="350" rx="430" ry="240" fill="url(#core)"/>
  <path class="dash" d="M80 112H1200" stroke="#38bdf8" stroke-opacity=".28" stroke-width="2" stroke-dasharray="8 18"/>
  <text class="sans" x="56" y="60" fill="#f8fafc" font-size="30" font-weight="950">TECH STACK CONSOLE</text>
  <text class="mono" x="56" y="94" fill="#7dd3fc" font-size="15">tools grouped by what they help me ship — model core, APIs, dashboards, memory and deployment</text>

  <!-- central safe zone -->
  <circle cx="640" cy="350" r="112" fill="#07111f" stroke="#67e8f9" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/>
  <circle class="pulse" cx="640" cy="350" r="145" fill="none" stroke="#a78bfa" stroke-opacity=".32" stroke-width="2"/>
  <circle cx="640" cy="350" r="190" fill="none" stroke="#38bdf8" stroke-opacity=".15" stroke-dasharray="6 14"/>
  <text class="sans" x="640" y="337" text-anchor="middle" fill="#e0f2fe" font-size="28" font-weight="950">AI / ML</text>
  <text class="sans" x="640" y="374" text-anchor="middle" fill="#c4b5fd" font-size="25" font-weight="950">FULL-STACK</text>
  <text class="mono" x="640" y="405" text-anchor="middle" fill="#94a3b8" font-size="12">end-to-end shipping layer</text>

  <!-- connection lines behind cards -->
  <g stroke-width="2" fill="none" opacity=".45">
    <path d="M350 218 C470 250 520 292 550 328" stroke="#38bdf8"/>
    <path d="M930 218 C810 250 760 292 730 328" stroke="#22c55e"/>
    <path d="M350 435 C470 412 520 388 550 372" stroke="#a78bfa"/>
    <path d="M930 435 C810 412 760 388 730 372" stroke="#f59e0b"/>
  </g>

  <g class="sans">
    <g transform="translate(70 150)">
      <rect width="300" height="146" rx="24" fill="#07111f" stroke="#38bdf8" stroke-opacity=".42"/>
      <circle class="pulse" cx="32" cy="38" r="7" fill="#38bdf8" filter="url(#glow)"/>
      <text class="card-title" x="52" y="45" fill="#67e8f9">ML / AI Core</text>
      <text class="card-line" x="28" y="83" fill="#e5e7eb">PyTorch • Transformers</text>
      <text class="card-line" x="28" y="111" fill="#e5e7eb">RAG • LangChain • Ollama</text>
      <text class="muted" x="28" y="132">model experiments + retrieval systems</text>
    </g>

    <g transform="translate(910 150)">
      <rect width="300" height="146" rx="24" fill="#07111f" stroke="#22c55e" stroke-opacity=".42"/>
      <circle class="pulse" cx="32" cy="38" r="7" fill="#22c55e" filter="url(#glow)"/>
      <text class="card-title" x="52" y="45" fill="#86efac">Full-Stack Layer</text>
      <text class="card-line" x="28" y="83" fill="#e5e7eb">React • Node • Express</text>
      <text class="card-line" x="28" y="111" fill="#e5e7eb">FastAPI • REST APIs</text>
      <text class="muted" x="28" y="132">dashboards + backend services</text>
    </g>

    <g transform="translate(70 370)">
      <rect width="300" height="146" rx="24" fill="#07111f" stroke="#a78bfa" stroke-opacity=".42"/>
      <circle class="pulse" cx="32" cy="38" r="7" fill="#a78bfa" filter="url(#glow)"/>
      <text class="card-title" x="52" y="45" fill="#c4b5fd">Data / Memory</text>
      <text class="card-line" x="28" y="83" fill="#e5e7eb">MongoDB • MySQL • Qdrant</text>
      <text class="card-line" x="28" y="111" fill="#e5e7eb">Vector search • semantic recall</text>
      <text class="muted" x="28" y="132">facts, retrieval, structured storage</text>
    </g>

    <g transform="translate(910 370)">
      <rect width="300" height="146" rx="24" fill="#07111f" stroke="#f59e0b" stroke-opacity=".42"/>
      <circle class="pulse" cx="32" cy="38" r="7" fill="#f59e0b" filter="url(#glow)"/>
      <text class="card-title" x="52" y="45" fill="#fcd34d">Systems / Tools</text>
      <text class="card-line" x="28" y="83" fill="#e5e7eb">Docker • Git • GitHub</text>
      <text class="card-line" x="28" y="111" fill="#e5e7eb">Postman • API testing</text>
      <text class="muted" x="28" y="132">reproducible and testable workflows</text>
    </g>

    <g transform="translate(410 530)">
      <rect width="460" height="72" rx="22" fill="#07111f" stroke="#67e8f9" stroke-opacity=".26"/>
      <text x="230" y="30" text-anchor="middle" fill="#dbeafe" font-size="15" font-weight="820">Python • Java • C • JavaScript • NumPy • Pandas</text>
      <text x="230" y="54" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="650">audio processing • vector search • API design • real-time pipelines</text>
    </g>
  </g>
</svg>