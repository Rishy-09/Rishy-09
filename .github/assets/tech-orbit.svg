<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Tech stack orbit">
<defs><radialGradient id="bg" cx="50%" cy="45%" r="72%"><stop stop-color="#0b1b35"/><stop offset="60%" stop-color="#020617"/><stop offset="100%" stop-color="#020617"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes spin2{from{transform:rotate(360deg)}to{transform:rotate(0)}}@keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}.orbit{animation:spin 34s linear infinite;transform-origin:640px 190px}.orbit2{animation:spin2 42s linear infinite;transform-origin:640px 190px}.pulse{animation:pulse 2.6s ease-in-out infinite}.sans{font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Arial}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style></defs>
<rect width="1280" height="360" rx="30" fill="url(#bg)"/><text class="sans" x="52" y="58" fill="#f8fafc" font-size="28" font-weight="900">TECH STACK CONSOLE</text><text class="mono" x="52" y="88" fill="#7dd3fc" font-size="15">not badges for decoration — tools mapped by what they build</text>
<circle cx="640" cy="190" r="74" fill="#07111f" stroke="#67e8f9" stroke-width="2" filter="url(#glow)"/><text class="sans" x="640" y="181" fill="#e0f2fe" text-anchor="middle" font-size="25" font-weight="900">AI/ML</text><text class="sans" x="640" y="213" fill="#c4b5fd" text-anchor="middle" font-size="22" font-weight="900">FULL-STACK</text>
<g class="orbit" opacity=".95"><circle cx="640" cy="190" r="132" fill="none" stroke="#38bdf8" stroke-opacity=".25" stroke-dasharray="5 11"/><circle cx="508" cy="190" r="9" fill="#38bdf8" filter="url(#glow)"/><circle cx="772" cy="190" r="9" fill="#a78bfa" filter="url(#glow)"/><circle cx="640" cy="58" r="9" fill="#22c55e" filter="url(#glow)"/><circle cx="640" cy="322" r="9" fill="#f59e0b" filter="url(#glow)"/></g><g class="orbit2" opacity=".9"><circle cx="640" cy="190" r="178" fill="none" stroke="#a78bfa" stroke-opacity=".20" stroke-dasharray="4 15"/><circle cx="462" cy="190" r="7" fill="#67e8f9"/><circle cx="818" cy="190" r="7" fill="#c084fc"/><circle cx="640" cy="12" r="7" fill="#86efac"/><circle cx="640" cy="368" r="7" fill="#fbbf24"/></g>
<g class="sans" font-size="15" font-weight="850">
  <g transform="translate(70 125)"><rect width="250" height="112" rx="22" fill="#07111f" stroke="#38bdf8" stroke-opacity=".35"/><text x="24" y="34" fill="#67e8f9">ML / AI</text><text x="24" y="66" fill="#e5e7eb">PyTorch • Transformers</text><text x="24" y="92" fill="#e5e7eb">RAG • LangChain • Ollama</text></g>
  <g transform="translate(960 125)"><rect width="250" height="112" rx="22" fill="#07111f" stroke="#22c55e" stroke-opacity=".35"/><text x="24" y="34" fill="#86efac">Full-Stack</text><text x="24" y="66" fill="#e5e7eb">React • Node • Express</text><text x="24" y="92" fill="#e5e7eb">FastAPI • REST APIs</text></g>
  <g transform="translate(350 35)"><rect width="230" height="92" rx="22" fill="#07111f" stroke="#a78bfa" stroke-opacity=".35"/><text x="24" y="34" fill="#c4b5fd">Data / Vector</text><text x="24" y="65" fill="#e5e7eb">MongoDB • MySQL • Qdrant</text></g>
  <g transform="translate(700 35)"><rect width="230" height="92" rx="22" fill="#07111f" stroke="#f59e0b" stroke-opacity=".35"/><text x="24" y="34" fill="#fcd34d">Systems</text><text x="24" y="65" fill="#e5e7eb">Docker • Git • Postman</text></g>
  <g transform="translate(350 255)"><rect width="580" height="64" rx="22" fill="#07111f" stroke="#67e8f9" stroke-opacity=".22"/><text x="24" y="40" fill="#dbeafe">Python • Java • C • JavaScript • NumPy • Pandas • Audio Processing</text></g>
</g></svg>