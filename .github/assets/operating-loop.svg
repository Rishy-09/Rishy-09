<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="Current operating loop">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="100%" stop-color="#061827"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes dash{to{stroke-dashoffset:-420}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}.dash{stroke-dasharray:10 18;animation:dash 10s linear infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}.sans{font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Arial}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style></defs>
<rect width="1280" height="330" rx="30" fill="url(#bg)"/><text class="sans" x="52" y="58" fill="#f8fafc" font-size="28" font-weight="900">CURRENT OPERATING LOOP</text><text class="mono" x="52" y="90" fill="#7dd3fc" font-size="15">how I turn learning into systems instead of collecting tutorials</text>
<path class="dash" d="M130 205 H1150" stroke="#67e8f9" stroke-width="3" opacity=".45" fill="none" filter="url(#glow)"/>
<g class="sans" font-weight="850" font-size="14">
 <g transform="translate(70 135)"><circle class="pulse" cx="54" cy="70" r="28" fill="#0e7490" filter="url(#glow)"/><text x="54" y="76" text-anchor="middle" fill="#fff" font-size="19">01</text><text x="0" y="135" fill="#e0f2fe">Break the model open</text><text x="0" y="158" fill="#94a3b8">understand internals</text></g>
 <g transform="translate(325 135)"><circle class="pulse" cx="54" cy="70" r="28" fill="#6d28d9" filter="url(#glow)"/><text x="54" y="76" text-anchor="middle" fill="#fff" font-size="19">02</text><text x="0" y="135" fill="#ede9fe">Build the backend</text><text x="0" y="158" fill="#94a3b8">routes + real data flow</text></g>
 <g transform="translate(570 135)"><circle class="pulse" cx="54" cy="70" r="28" fill="#15803d" filter="url(#glow)"/><text x="54" y="76" text-anchor="middle" fill="#fff" font-size="19">03</text><text x="0" y="135" fill="#dcfce7">Add memory + retrieval</text><text x="0" y="158" fill="#94a3b8">context beats guessing</text></g>
 <g transform="translate(830 135)"><circle class="pulse" cx="54" cy="70" r="28" fill="#b45309" filter="url(#glow)"/><text x="54" y="76" text-anchor="middle" fill="#fff" font-size="19">04</text><text x="0" y="135" fill="#ffedd5">Ship an interface</text><text x="0" y="158" fill="#94a3b8">usable product shape</text></g>
 <g transform="translate(1065 135)"><circle class="pulse" cx="54" cy="70" r="28" fill="#be123c" filter="url(#glow)"/><text x="54" y="76" text-anchor="middle" fill="#fff" font-size="19">05</text><text x="0" y="135" fill="#ffe4e6">Document failure</text><text x="0" y="158" fill="#94a3b8">rebuild what broke</text></g>
</g></svg>