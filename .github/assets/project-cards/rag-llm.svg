<svg xmlns="http://www.w3.org/2000/svg" width="610" height="235" viewBox="0 0 610 235" role="img" aria-label="RAG_LLM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="55%" stop-color="#020617"/><stop offset="100%" stop-color="#0b1220"/></linearGradient>
    <radialGradient id="r" cx="82%" cy="12%" r="70%"><stop stop-color="#a78bfa" stop-opacity=".36"/><stop offset="75%" stop-color="#020617" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.9;transform:scale(1.06)}}
      @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,16px)}}
      @keyframes dash{to{stroke-dashoffset:-320}}
      .pulse{animation:pulse 3s ease-in-out infinite;transform-origin:center}.drift{animation:drift 7s ease-in-out infinite}.dash{stroke-dasharray:8 14;animation:dash 8s linear infinite}.sans{font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Arial}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>
  <rect width="610" height="235" rx="26" fill="url(#bg)" stroke="#a78bfa" stroke-opacity=".32"/>
  <rect width="610" height="235" rx="26" fill="url(#r)"/>
  <g class="drift" opacity=".7"><circle cx="510" cy="58" r="68" fill="#a78bfa" opacity=".13"/><circle cx="560" cy="180" r="92" fill="#a78bfa" opacity=".08"/></g>
  <circle class="pulse" cx="76" cy="74" r="34" fill="#6d28d9" stroke="#a78bfa" stroke-width="2" filter="url(#glow)"/>
  <text x="76" y="85" text-anchor="middle" font-size="31">🧠</text>
  <text class="sans" x="126" y="63" fill="#f8fafc" font-size="27" font-weight="900">RAG_LLM</text>
  <text class="sans" x="126" y="96" fill="#cbd5e1" font-size="16" font-weight="650">Private document QA with semantic retrieval and local inference.</text>
  <rect x="126" y="122" width="420" height="37" rx="18.5" fill="#020617" stroke="#a78bfa" stroke-opacity=".28"/>
  <text class="mono" x="146" y="146" fill="#dbeafe" font-size="14">FastAPI • LangChain • Qdrant • Ollama • Docker</text>
  <path class="dash" d="M72 179 H540" fill="none" stroke="#a78bfa" stroke-width="2" opacity=".38"/>
  <text class="mono" x="70" y="208" fill="#a78bfa" font-size="13" font-weight="800">OPEN REPOSITORY →</text>
</svg>