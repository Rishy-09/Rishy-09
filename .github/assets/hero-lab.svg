<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Naman Chanana AI ML Full Stack Engineer">
  <defs>
    <radialGradient id="core" cx="66%" cy="43%" r="58%"><stop offset="0%" stop-color="#00f5ff" stop-opacity="0.40"/><stop offset="40%" stop-color="#7c3aed" stop-opacity="0.22"/><stop offset="76%" stop-color="#020617" stop-opacity="0"/></radialGradient>
    <radialGradient id="purple" cx="18%" cy="28%" r="54%"><stop offset="0%" stop-color="#a855f7" stop-opacity="0.30"/><stop offset="82%" stop-color="#020617" stop-opacity="0"/></radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111827" stop-opacity="0.88"/><stop offset="56%" stop-color="#020617" stop-opacity="0.64"/><stop offset="100%" stop-color="#031b2e" stop-opacity="0.86"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#38bdf8" stroke-opacity="0.085" stroke-width="1"/></pattern>
    <style>
      @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(28px,-16px)}}
      @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-34px,20px)}}
      @keyframes pulse{0%,100%{opacity:.30;transform:scale(1)}50%{opacity:.95;transform:scale(1.045)}}
      @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
      @keyframes dash{to{stroke-dashoffset:-520}}
      @keyframes blink{0%,47%,100%{opacity:1}48%,82%{opacity:.16}}
      @keyframes scan{0%{transform:translateY(-90px);opacity:0}15%{opacity:.55}85%{opacity:.55}100%{transform:translateY(700px);opacity:0}}
      @keyframes floatText{0%,100%{opacity:.13;transform:translateX(0)}50%{opacity:.36;transform:translateX(18px)}}
      .drift{animation:drift 8s ease-in-out infinite;transform-origin:center}.drift2{animation:drift2 11s ease-in-out infinite;transform-origin:center}.pulse{animation:pulse 3s ease-in-out infinite;transform-origin:center}.spin{animation:spin 24s linear infinite;transform-origin:936px 300px}.dash{stroke-dasharray:12 18;animation:dash 12s linear infinite}.blink{animation:blink 1.3s steps(1) infinite}.scan{animation:scan 6s linear infinite}.floatText{animation:floatText 7s ease-in-out infinite}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
    </style>
  </defs>
  <rect width="1280" height="640" rx="34" fill="#020617"/><rect width="1280" height="640" rx="34" fill="url(#grid)" opacity="0.88"/><rect width="1280" height="640" rx="34" fill="url(#core)"/><rect width="1280" height="640" rx="34" fill="url(#purple)"/>
  <g class="floatText mono" fill="#dbeafe" font-size="18"><text x="56" y="82">audio_stream.decode(µ-law) → vad.detect_turn()</text><text x="56" y="132">retriever.query(context) → local_llm.generate()</text><text x="56" y="182">api.route('/query') → dashboard.render()</text><text x="56" y="232">transformer.forward(tokens, mask)</text></g>
  <rect class="scan" x="0" y="0" width="1280" height="82" fill="#67e8f9" opacity="0.10"/>
  <g transform="translate(54 58)">
    <rect width="724" height="520" rx="30" fill="url(#panel)" stroke="#38bdf8" stroke-opacity="0.25"/>
    <rect x="24" y="22" width="676" height="44" rx="15" fill="#030712" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="54" cy="44" r="6" fill="#fb7185"/><circle cx="80" cy="44" r="6" fill="#facc15"/><circle cx="106" cy="44" r="6" fill="#34d399"/>
    <text class="mono" x="136" y="50" fill="#8bdcfb" font-size="15">/systems/naman.profile</text><text class="mono blink" x="330" y="50" fill="#e0f2fe" font-size="16">_</text>
    <text class="sans" x="38" y="138" fill="#ffffff" font-size="54" font-weight="900" letter-spacing="-2">Naman Chanana</text>
    <text class="sans" x="40" y="182" fill="#93c5fd" font-size="24" font-weight="850">AI/ML + Full-Stack Engineer</text>
    <text class="sans" x="40" y="238" fill="#f8fafc" font-size="33" font-weight="900">Building End-to-End AI Systems</text>
    <text class="sans" x="40" y="280" fill="#c4b5fd" font-size="24" font-weight="750">Voice Agents • RAG • Transformers • MERN Apps</text>
    <g transform="translate(40 330)" class="sans" font-size="15" font-weight="850">
      <rect width="118" height="38" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.45"/><text x="21" y="25" fill="#e0f2fe">Rishy-09</text>
      <rect x="134" width="136" height="38" rx="19" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.45"/><text x="156" y="25" fill="#ede9fe">Kaggle</text><text x="218" y="25" fill="#8bdcfb">ML</text>
      <rect x="286" width="126" height="38" rx="19" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.5"/><text x="309" y="25" fill="#ffedd5">LeetCode</text>
      <rect x="428" width="158" height="38" rx="19" fill="#0f172a" stroke="#22c55e" stroke-opacity="0.45"/><text x="449" y="25" fill="#dcfce7">Always shipping</text>
    </g>
    <g transform="translate(40 410)" class="mono" font-size="15">
      <text x="0" y="0" fill="#67e8f9">status:</text><text x="84" y="0" fill="#e5e7eb">local-first AI systems, deployment-style engineering,</text><text x="84" y="27" fill="#e5e7eb">and honest iteration over polished fake perfection</text>
      <text x="0" y="68" fill="#67e8f9">signal:</text><text x="84" y="68" fill="#e5e7eb">voice calling • document QA • bug tracking</text><text x="84" y="95" fill="#e5e7eb">translation • ML fundamentals • backend systems</text>
    </g>
  </g>
  <g transform="translate(815 108)">
    <circle class="drift" cx="206" cy="202" r="178" fill="#0f172a" opacity="0.54" stroke="#38bdf8" stroke-opacity="0.17"/>
    <circle class="spin dash" cx="206" cy="202" r="150" fill="none" stroke="#67e8f9" stroke-width="2" opacity="0.52"/>
    <circle class="spin" cx="206" cy="202" r="112" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 13" opacity="0.58"/>
    <circle class="pulse" cx="206" cy="202" r="76" fill="#061629" stroke="#67e8f9" stroke-width="2.5" filter="url(#glow)"/>
    <text class="sans" x="206" y="190" text-anchor="middle" fill="#e0f2fe" font-size="24" font-weight="900">LOCAL</text><text class="sans" x="206" y="222" text-anchor="middle" fill="#c4b5fd" font-size="24" font-weight="900">AI CORE</text>
    <g filter="url(#glow)"><circle cx="66" cy="90" r="8" fill="#67e8f9"/><text class="mono" x="82" y="96" fill="#bfdbfe" font-size="14">Whisper</text><circle cx="342" cy="124" r="8" fill="#c084fc"/><text class="mono" x="362" y="130" fill="#ddd6fe" font-size="14">Llama</text><circle cx="340" cy="294" r="8" fill="#22d3ee"/><text class="mono" x="360" y="300" fill="#cffafe" font-size="14">Piper</text><circle cx="68" cy="304" r="8" fill="#fbbf24"/><text class="mono" x="84" y="310" fill="#fef3c7" font-size="14">FastAPI</text><path class="dash" d="M74 94 C144 62, 244 58, 334 120" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/><path class="dash" d="M338 134 C378 196, 376 240, 338 288" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.6"/><path class="dash" d="M332 300 C236 352, 148 352, 76 310" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.6"/><path class="dash" d="M68 294 C30 226, 30 162, 64 100" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.45"/></g>
  </g>
  <g class="drift2" filter="url(#soft)"><circle cx="1070" cy="74" r="82" fill="#38bdf8" opacity="0.11"/><circle cx="782" cy="566" r="122" fill="#a855f7" opacity="0.10"/></g>
</svg>