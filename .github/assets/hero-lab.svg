<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Naman Chanana AI ML Full Stack Engineer">
  <defs>
    <radialGradient id="core" cx="64%" cy="43%" r="56%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.38"/>
      <stop offset="38%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="72%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.32"/>
      <stop offset="80%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.84"/>
      <stop offset="55%" stop-color="#020617" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#031b2e" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#38bdf8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <style>
      @keyframes drift { 0%,100%{transform:translate(0,0)} 50%{transform:translate(32px,-18px)} }
      @keyframes drift2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-38px,22px)} }
      @keyframes pulse { 0%,100%{opacity:.28; transform:scale(1)} 50%{opacity:.9; transform:scale(1.05)} }
      @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes dash { to{stroke-dashoffset:-520} }
      @keyframes blink { 0%,47%,100%{opacity:1} 48%,82%{opacity:.15} }
      @keyframes scan { 0%{transform:translateY(-80px); opacity:0} 15%{opacity:.6} 85%{opacity:.6} 100%{transform:translateY(610px); opacity:0} }
      @keyframes floatText { 0%,100%{opacity:.16; transform:translateX(0)} 50%{opacity:.42; transform:translateX(18px)} }
      .drift{animation:drift 8s ease-in-out infinite; transform-origin:center}
      .drift2{animation:drift2 11s ease-in-out infinite; transform-origin:center}
      .pulse{animation:pulse 3s ease-in-out infinite; transform-origin:center}
      .spin{animation:spin 22s linear infinite; transform-origin:920px 260px}
      .dash{stroke-dasharray:12 18; animation:dash 12s linear infinite}
      .blink{animation:blink 1.3s steps(1) infinite}
      .scan{animation:scan 6s linear infinite}
      .floatText{animation:floatText 7s ease-in-out infinite}
      .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace}
      .sans{font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif}
    </style>
  </defs>
  <rect width="1280" height="560" rx="34" fill="#020617"/>
  <rect width="1280" height="560" rx="34" fill="url(#grid)" opacity="0.85"/>
  <rect width="1280" height="560" rx="34" fill="url(#core)"/>
  <rect width="1280" height="560" rx="34" fill="url(#purple)"/>
  <g class="floatText mono" fill="#dbeafe" font-size="18">
    <text x="56" y="82">audio_stream.decode(µ-law) → vad.detect_turn()</text>
    <text x="56" y="132">retriever.query(context) → local_llm.generate()</text>
    <text x="56" y="182">api.route('/query') → dashboard.render()</text>
    <text x="56" y="232">transformer.forward(tokens, mask)</text>
  </g>
  <rect class="scan" x="0" y="0" width="1280" height="78" fill="#67e8f9" opacity="0.10"/>

  <g transform="translate(58 58)">
    <rect width="694" height="444" rx="28" fill="url(#panel)" stroke="#38bdf8" stroke-opacity="0.25"/>
    <rect x="22" y="20" width="650" height="42" rx="15" fill="#030712" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="50" cy="41" r="6" fill="#fb7185"/><circle cx="74" cy="41" r="6" fill="#facc15"/><circle cx="98" cy="41" r="6" fill="#34d399"/>
    <text class="mono" x="126" y="47" fill="#8bdcfb" font-size="15">/systems/naman.profile</text>
    <text class="mono blink" x="316" y="47" fill="#e0f2fe" font-size="16">_</text>

    <text class="sans" x="34" y="132" fill="#ffffff" font-size="52" font-weight="900" letter-spacing="-2">Naman Chanana</text>
    <text class="sans" x="36" y="174" fill="#93c5fd" font-size="23" font-weight="800">AI/ML + Full-Stack Engineer</text>
    <text class="sans" x="36" y="226" fill="#dbeafe" font-size="30" font-weight="800">Building End-to-End AI Systems</text>
    <text class="sans" x="36" y="264" fill="#c4b5fd" font-size="24" font-weight="700">Voice Agents • RAG • Transformers • MERN Apps</text>

    <g transform="translate(36 310)" class="sans" font-size="16" font-weight="800">
      <rect width="120" height="38" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.45"/><text x="22" y="25" fill="#e0f2fe">Rishy-09</text>
      <rect x="134" width="150" height="38" rx="19" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.45"/><text x="156" y="25" fill="#ede9fe">Kaggle</text><text x="222" y="25" fill="#8bdcfb">ML</text>
      <rect x="298" width="120" height="38" rx="19" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.5"/><text x="322" y="25" fill="#ffedd5">LeetCode</text>
      <rect x="432" width="144" height="38" rx="19" fill="#0f172a" stroke="#22c55e" stroke-opacity="0.45"/><text x="454" y="25" fill="#dcfce7">Always shipping</text>
    </g>

    <g transform="translate(36 382)" class="mono" font-size="16">
      <text x="0" y="0" fill="#67e8f9">status:</text><text x="76" y="0" fill="#e5e7eb">local-first AI systems, deployment-style engineering, honest iteration</text>
      <text x="0" y="30" fill="#67e8f9">signal:</text><text x="76" y="30" fill="#e5e7eb">voice calling • document QA • bug tracking • translation • ML fundamentals</text>
    </g>
  </g>

  <g transform="translate(820 82)">
    <circle class="drift" cx="200" cy="178" r="168" fill="#0f172a" opacity="0.54" stroke="#38bdf8" stroke-opacity="0.17"/>
    <circle class="spin dash" cx="200" cy="178" r="142" fill="none" stroke="#67e8f9" stroke-width="2" opacity="0.52"/>
    <circle class="spin" cx="200" cy="178" r="104" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 13" opacity="0.58"/>
    <circle class="pulse" cx="200" cy="178" r="72" fill="#061629" stroke="#67e8f9" stroke-width="2.5" filter="url(#glow)"/>
    <text class="sans" x="200" y="166" text-anchor="middle" fill="#e0f2fe" font-size="24" font-weight="900">LOCAL</text>
    <text class="sans" x="200" y="198" text-anchor="middle" fill="#c4b5fd" font-size="24" font-weight="900">AI CORE</text>
    <g filter="url(#glow)">
      <circle cx="60" cy="80" r="8" fill="#67e8f9"/><text class="mono" x="76" y="86" fill="#bfdbfe" font-size="14">Whisper</text>
      <circle cx="330" cy="112" r="8" fill="#c084fc"/><text class="mono" x="350" y="118" fill="#ddd6fe" font-size="14">Llama</text>
      <circle cx="330" cy="276" r="8" fill="#22d3ee"/><text class="mono" x="350" y="282" fill="#cffafe" font-size="14">Piper</text>
      <circle cx="62" cy="286" r="8" fill="#fbbf24"/><text class="mono" x="78" y="292" fill="#fef3c7" font-size="14">FastAPI</text>
      <path class="dash" d="M70 84 C140 52, 236 48, 322 108" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
      <path class="dash" d="M326 122 C366 180, 364 224, 326 270" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
      <path class="dash" d="M320 282 C226 330, 142 330, 70 292" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
      <path class="dash" d="M62 276 C26 210, 26 150, 58 90" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.45"/>
    </g>
  </g>

  <g class="drift2" filter="url(#soft)">
    <circle cx="1056" cy="74" r="82" fill="#38bdf8" opacity="0.11"/>
    <circle cx="780" cy="500" r="114" fill="#a855f7" opacity="0.10"/>
  </g>
</svg>
