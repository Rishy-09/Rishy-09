name: Refresh profile README

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This workflow is intentionally minimal.
      # Your README already works with static assets.
      # Later, after installing readme-aura, replace this section with:
      #
      # - name: Setup Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      #
      # - name: Build readme-aura assets
      #   run: npx readme-aura build
      #
      # - name: Commit generated README/assets
      #   uses: stefanzweifel/git-auto-commit-action@v5
      #   with:
      #     commit_message: "chore: refresh generated profile README"

      - name: Validate profile assets exist
        run: |
          test -f README.md
          test -f .github/assets/hero-banner.png
          test -f .github/assets/build-map.svg
          test -f .github/assets/featured-systems.svg
          test -f .github/assets/tech-stack.svg
          test -f .github/assets/signals.svg
